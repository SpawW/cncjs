services:
  # Grbl v1.1 controller simulator (TCP). cncjs reaches it through the serial
  # bridge created in the cncjs container.
  grbl-sim:
    image: node:20-bookworm
    working_dir: /sim
    command: node grbl-server.js 5000
    volumes:
      - ./grbl-simulator:/sim:ro
    expose:
      - "5000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('net');const s=net.connect(5000,'localhost');s.on('connect',()=>process.exit(0));s.on('error',()=>process.exit(1));"
      interval: 2s
      timeout: 2s
      retries: 15

  # cncjs in development mode: Webpack dev server on 8080 proxying the API to
  # the backend on 8000. Open http://localhost:8080
  cncjs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      grbl-sim:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - WEBPACK_DEV_SERVER_HOST=0.0.0.0
      - WEBPACK_DEV_SERVER_WS_URL=auto://0.0.0.0:8091/ws
      - PROXY_TARGET=http://localhost:8000
      - GRBL_SIM_HOST=grbl-sim
      - GRBL_SIM_PORT=5000
      - CNCJS_CONFIG_FILE=/data/.cncrc
    ports:
      # cncjs is served by the backend (renders index.hbs + token).
      # Open http://localhost:8000
      - "8000:8000"
      # Webpack dev server (asset rebuilds + HMR websocket)
      - "8091:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - cncjs-config:/data
      - /dev:/dev
    # /dev is bind-mounted so hotplugged nodes show up automatically, but Docker
    # still filters device numbers via cgroup. Whitelist the whole major ranges
    # (188 = ttyUSB, 166 = ttyACM) so any USB serial adapter works without
    # hardcoding a path that changes across reboots.
    device_cgroup_rules:
      - "c 188:* rwm"
      - "c 166:* rwm"
    # No healthcheck means Docker only ever reports "Up" for this service, so
    # the "(healthy)" you see early belongs to grbl-sim alone. Poll the real
    # app: "/" is served by the backend rendering output/cncjs/app/index.hbs,
    # so a 200 means the UI is genuinely usable.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 15s
    stdin_open: true
    tty: true

volumes:
  node_modules:
  cncjs-config:
